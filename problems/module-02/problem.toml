id = "module-02"
title = { en = "Lost in modules", ja = "モジュールで迷子" }
difficulty = 2
concepts = [
    "module privacy and paths",
    "crate:: is the crate root, not the player's file",
    "tuple struct fields are private by default",
    "pub use re-exports, which cannot be more visible than the item (E0364)",
    "pub(super) / pub(crate)",
]
kind = "repair"

[judge]
forbid_unsafe = true
miri_checks = "full"
time_limit_ms = 15000
stdout_limit_bytes = 65536
harness_visible = false
