id = "mem-01"
title = { en = "Connection state machine", ja = "接続のステートマシン" }
difficulty = 2
concepts = [
    "moving out of &mut self (E0507)",
    "mem::take / mem::replace",
    "the placeholder left by mem::take must be replaced on every path",
    "match as the right-hand side of an assignment: every arm yields the next state",
    "#[derive(Default)] with #[default]",
    "enum state machines with owned payloads",
    "match guards with by-move bindings",
]
kind = "repair"

[judge]
forbid_unsafe = true
miri_checks = "full"
time_limit_ms = 15000
stdout_limit_bytes = 65536
harness_visible = false
