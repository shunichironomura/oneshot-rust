id = "pool-01"
title = { en = "A thread pool that shuts down cleanly", ja = "きれいに止まるスレッドプール" }
difficulty = 3
concepts = [
    "worker threads sharing one queue: Arc<Mutex<Receiver<Job>>>",
    "type Job = Box<dyn FnOnce() + Send + 'static>",
    "Drop for graceful shutdown: close the channel (drop the Sender) before joining",
    "JoinHandle::join takes self: Vec::drain / Option::take (E0507)",
    "no moving fields out of a Drop type in shutdown(self) (E0509): share a &mut self helper",
    "lock guard temporaries in while let / match keep the lock while the job runs",
]
kind = "implement"

[judge]
forbid_unsafe = true
miri_checks = "full"
time_limit_ms = 20000
stdout_limit_bytes = 65536
harness_visible = false
