id = "closure-03"
title = { en = "Captured counters", ja = "捕まえたままのカウンタ" }
difficulty = 2
concepts = [
    "closures capture by &mut",
    "the borrow lasts until the closure's last use",
    "borrow liveness follows control flow (push before break is fine)",
    "move closures for returned closures",
    "moving a reference into a closure still borrows",
    "restructuring around captures",
]
