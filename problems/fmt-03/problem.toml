id = "fmt-03"
title = { en = "Redacted debug output", ja = "秘密を伏せたデバッグ表示" }
difficulty = 2
concepts = [
  "manual fmt::Debug matching derive output",
  "Formatter::debug_struct / debug_tuple",
  "Debug of &str adds quotes: format_args! or a wrapper type for bare text",
  "DebugStruct::finish_non_exhaustive",
  "builder kept in a variable (E0716 on a temporary)",
  "{:#?} alternate and {:x?} flags reaching fields",
]
kind = "implement"

[judge]
forbid_unsafe = true
miri_checks = "full"
time_limit_ms = 15000
stdout_limit_bytes = 65536
harness_visible = false
